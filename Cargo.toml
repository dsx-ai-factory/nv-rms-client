[package]
name = "librms"
description = "NVIDIA Rack Management Service protocol crate"
authors = [ "NVIDIA Engineering <dcss-forge-rms@exchange.nvidia.com>" ]
repository = "https://github.com/dsx-ai-factory/nv-rms-client.git"
license = "Apache-2.0"
version = "0.0.15"
edition = "2024"

[features]
# Keep the default crate behavior: client APIs and serde support are available
# unless a consumer opts out with `default-features = false`.
default = ["client", "serde"]

# Cargo only compiles optional dependencies when a feature enables them with
# `dep:<name>`. Everything listed here is used only by the RMS client transport,
# retry, TLS, or wrapper layers, so server-only consumers can omit this feature
# and avoid pulling the client stack.
client = [
    "dep:async-trait",
    "dep:chrono",
    "dep:eyre",
    "dep:hyper",
    "dep:hyper-rustls",
    "dep:hyper-timeout",
    "dep:hyper-util",
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:tokio",
    "dep:tonic-client-wrapper",
    "dep:tower",
    "dep:tracing",
    "dep:tryhard",
    "dep:thiserror",
    "tonic/tls-ring",
]

# Builds generated `rack_manager_server` service definitions without enabling
# client transport dependencies.
server = []

# Adds serde derives to generated protobuf wire models. This is independent from
# client/server generation so consumers can choose serialization support alone.
serde = ["dep:chrono", "dep:serde"]

[dependencies]
# Optional dependencies are enabled by the feature lists above. Shared protobuf
# dependencies stay non-optional because all feature combinations need the wire
# model types generated from `rack_manager.proto`.
tonic-client-wrapper = { path = "tonic-client-wrapper", default-features = false, optional = true, version = "1.1.0" }

tokio = { version = "1", features = ["full", "tracing"], optional = true }
tonic = "0.14"
hyper = { version = "^1", optional = true }
hyper-rustls = { version = "^0.27", features = ["http2"], optional = true }
hyper-timeout = { version = "^0.5", optional = true }
hyper-util = { version = "^0.1", optional = true }
rustls = { version = "0.23.16", optional = true }
async-trait = { version = "0.1.88", optional = true }
chrono = { version = "0.4", optional = true }
eyre = { version = "0.6.12", optional = true }
prost = "0.14.1"
prost-types = "0.14.1"
rustls-pemfile = { version = "2.2.0", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
thiserror = { version = "2.0.14", optional = true }
tonic-prost = "0.14"
tower = { version = "0.5", optional = true }
tracing = { version = "0.1.41", optional = true }
tryhard = { version = "0.5.1", optional = true }

[dev-dependencies]
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http2"] }

[build-dependencies]
tonic-client-wrapper = { path = "tonic-client-wrapper", default-features = false, features = ["codegen"], optional = true }
tonic-prost-build = "0.14"

[lints.clippy]
cloned_instead_of_copied = "warn"
redundant_clone = "warn"
large_stack_arrays = "warn"
unused_async = "warn"
