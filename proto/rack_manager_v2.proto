syntax = "proto3";

package rack_manager_v2;

import "rack_manager.proto";

service RackManagerV2 {
  /*
   * ConfigureScaleUpFabricManager declaratively configures the scale-up fabric across
   * all supplied switches through an asynchronous reconciliation job. Matching
   * settings with verified controller activation cause no writes or restarts.
   *
   * Callers should poll GetJobStatus before resubmitting and avoid issuing concurrent
   * ConfigureScaleUpFabricManager requests for overlapping switch inventories.
   *
   * Without layout, requests with an empty topology_type or otherwise invalid
   * config are rejected synchronously with INVALID_ARGUMENT; no job is started.
   *
   * Returns a job_id; poll it via rack_manager.GetJobStatus. Without layout,
   * successful jobs return JSON-encoded rack_manager.ScaleUpFabricStatus in
   * rack_manager.JobStatus.result_json.
   *
   * With layout, the resulting configuration contains one cluster and primary per
   * fabric, with administrative switch connectivity matching the requested layout.
   * GetJobStatus reports execution state and errors. GetScaleUpFabricStatus with
   * inspection reports current per-fabric configuration and health, including
   * partial configurations after a failed job.
   * Completion requires verified administrative switch settings and configured
   * fabric-manager control planes, not compute software or operational GPU links.
   */
  rpc ConfigureScaleUpFabricManager(ConfigureScaleUpFabricManagerRequest) returns (ConfigureScaleUpFabricManagerResponse) {}

  /*
   * StartSystemValidation launches an NVSSVT system validation scan against each
   * Device Under Test (DUT) in the request, each as its own asynchronous RMS job.
   * NVSSVT itself may run for a long time, and each node's scan runs independently:
   * one node's admission or launch failure does not affect any other node's scan.
   *
   * Returns a parent job_id (response.job_id); poll it via rack_manager.GetJobStatus
   * to track the batch as a whole. Each admitted node's own scan job_id is also
   * returned in `jobs`, for polling and result retrieval scoped to that node. On
   * completion, each scan job's rack_manager.JobStatus.result_json holds its
   * parsed per-DUT status and summary report JSON.
   */
  rpc StartSystemValidation(StartSystemValidationRequest) returns (StartSystemValidationResponse) {}
}

/*
 * ScaleUpFabricConfig describes the desired fabric-manager topology and static
 * configuration.
 */
message ScaleUpFabricConfig {
  // Topology to be configured for the scale-up fabric (applied to the fabric manager).
  string topology_type = 1;

  // Additional static configuration entries to apply to the fabric manager. This is a
  // generic pass-through for configuration without a dedicated field above. Each
  // (config_file_name, key) pair must be unique; duplicate keys are rejected.
  // With layout, omitted deployment-managed keys are removed. Other omitted keys
  // remain unchanged. Without layout, all omitted static settings remain unchanged.
  repeated rack_manager.ScaleUpFabricStaticConfig extra_static_configs = 2;
}

/*
 * ConfigureScaleUpFabricManagerRequest declaratively describes the desired scale-up
 * fabric across a set of switches. RMS reconciles the switches toward this desired
 * state, applying only the changes required to verify the requested configuration
 * and controller activation. Matching stored settings may require a controller
 * restart when activation cannot be verified.
 *
 * Direct switch requests use each node's host_endpoint for address and credentials.
 */
message ConfigureScaleUpFabricManagerRequest {
  // All switches that form the scale-up fabric. With layout, supply every physical
  // switch tray, including switches outside the requested fabrics.
  rack_manager.NodeSet nodes = 1;

  // ID of the switch node that should run the fabric manager (the primary host).
  // If absent, RMS selects the switch at the lowest position in the rack.
  optional string primary_switch_node_id = 2;

  // Optional site selector used for switch server verification (TLS).
  // Defaults to --default-switch-domain when unset.
  optional string domain = 3;

  // Required desired configuration, applied to each resolved fabric with layout.
  ScaleUpFabricConfig config = 4;

  // Presence selects layout reconciliation; absence selects single-cluster behavior
  // without changing managed link settings.
  // Requires config. Top-level primary_switch_node_id must be absent.
  // A present layout with no fabrics is invalid.
  // One fabric matching the physical topology's complete compute and switch counts
  // reconciles full connectivity and one controller cluster.
  // Smaller fabrics isolate unassigned capacity.
  ScaleUpFabricLayout layout = 5;

  // Compute trays available for layout selection, one node per tray, with hardware
  // identity and BMC endpoints and credentials for placement discovery.
  // Required for smaller fabrics; trays outside the requested fabrics may be omitted.
  // A full-topology fabric may omit compute inventory without compute BMC access.
  // If supplied for a full-topology fabric, inventory must contain every compute tray.
  // Supplying compute_nodes without layout is invalid.
  rack_manager.NodeSet compute_nodes = 6;
}

// ConfigureScaleUpFabricManagerResponse returns the handle to the reconciliation job.
message ConfigureScaleUpFabricManagerResponse {
  // ID of the asynchronous job that reconciles the scale-up fabric.
  // Poll it via rack_manager.GetJobStatus. Read current configuration and health
  // via rack_manager.GetScaleUpFabricStatus. Successful no-layout jobs also return
  // JSON-encoded rack_manager.ScaleUpFabricStatus in result_json.
  string job_id = 1;

  // Empty without layout. With layout, one resolved assignment per
  // requested fabric, in request order. Accepted intent, not applied state.
  repeated ScaleUpFabricAssignment resolved_fabrics = 2;
}

// Desired fabrics selected from the request's switch and compute inventories.
// Supported sizes and placements depend on the server and physical topology.
// Physical positions are discovered from the supplied nodes.
message ScaleUpFabricLayout {
  // Complete desired fabric set for the supplied inventory.
  // Unresolved positions, ambiguous topology, or unsupported layouts fail admission.
  // Memberships must not overlap. Unassigned capacity is isolated and controllers
  // on unassigned switches are disabled. List order correlates results, not placement.
  repeated ScaleUpFabricSpec fabrics = 2;
}

// Target size of one independently managed fabric. RMS selects disjoint membership
// deterministically for unchanged inventory and layout. Inventory or size changes
// may change membership.
message ScaleUpFabricSpec {
  // Positive total number of physical compute trays in this fabric.
  // The requested size and placement must be supported by the server.
  uint32 compute_tray_count = 1;

  // Positive total number of physical switch trays in this fabric.
  uint32 switch_tray_count = 2;

  // Optional primary preference constrains selection to a group containing this switch.
  // If absent, a primary is selected deterministically from this fabric's switches.
  optional string primary_switch_node_id = 5;
}

// Accepted membership for one requested fabric, not configuration or health state.
message ScaleUpFabricAssignment {
  // Selected compute tray IDs; empty when full-topology compute inventory is omitted.
  repeated string compute_node_ids = 1;

  // Selected switch tray IDs from the request's switch inventory.
  repeated string switch_node_ids = 2;

  // Selected primary switch ID, which belongs to switch_node_ids.
  string primary_switch_node_id = 3;
}

// StartSystemValidationRequest identifies the nodes to scan. NVSSVT reaches each
// Device Under Test (DUT) over its BMC (required) and, when supplied, its host OS, so
// every node's bmc_endpoint must carry credentials.
message StartSystemValidationRequest {
  rack_manager.NodeSet nodes = 1;

  // Passed through to NVSSVT as --config-override for every node's scan. Left
  // unset, NVSSVT applies its own configuration defaults. RMS does not
  // interpret or validate this value; NVSSVT rejects it if malformed.
  string config_override = 2;
}

// NodeSystemValidationJobInfo pairs a node with its async system validation job ID.
message NodeSystemValidationJobInfo {
  string node_id = 1; // Node identifier, as supplied in the request
  string job_id = 2; // System validation job ID returned for this node
}

// StartSystemValidationResponse reports the launched scans' job handles, one
// per admitted node. The NVSSVT process id and log directory live on the
// launcher's side of the pod and are not addressable by callers, so they are
// reported in RMS's logs rather than here; each scan's log directory also
// appears in its job's result_json once it completes.
message StartSystemValidationResponse {
  rack_manager.NodeBatchResponse response = 1; // response.job_id is the parent job ID for GetJobStatus
  repeated NodeSystemValidationJobInfo jobs = 2; // Individual scan job ID per node
}
