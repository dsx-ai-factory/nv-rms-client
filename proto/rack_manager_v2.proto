syntax = "proto3";

package rack_manager_v2;

import "rack_manager.proto";

service RackManagerV2 {
  /*
   * ConfigureScaleUpFabricManager declaratively configures the scale-up fabric across
   * all supplied switches. The caller describes the desired fabric configuration and
   * RMS starts a single asynchronous reconciliation job that performs only the actions
   * required to move the observed switch state toward the desired state: it skips
   * disabling the fabric when it is already disabled, and does nothing when the observed
   * configuration already matches the request.
   *
   * The call is safe to invoke periodically in a loop to keep switch configuration
   * "as intended" without causing fabric availability issues. RMS aims to run one
   * reconciliation job at a time; callers should poll GetJobStatus before resubmitting
   * and avoid issuing concurrent ConfigureScaleUpFabricManager requests.
   *
   * Requests with an empty topology_type or otherwise invalid config are rejected
   * synchronously with INVALID_ARGUMENT; no job is started.
   *
   * Returns a job_id; poll it via rack_manager.GetJobStatus. On completion,
   * rack_manager.JobStatus.result_json holds a JSON-encoded
   * rack_manager.ScaleUpFabricStatus describing the resulting fabric state.
   */
  rpc ConfigureScaleUpFabricManager(ConfigureScaleUpFabricManagerRequest) returns (ConfigureScaleUpFabricManagerResponse) {}

  /*
   * StartSystemValidation launches an NVSSVT system validation scan against a
   * DUT as an asynchronous RMS job. NVSSVT itself may run for a long time.
   *
   * Returns a job_id; poll it via rack_manager.GetJobStatus. On completion,
   * rack_manager.JobStatus.result_json holds the scan's parsed per-DUT status
   * and summary report JSON.
   */
  rpc StartSystemValidation(StartSystemValidationRequest) returns (StartSystemValidationResponse) {}
}

/*
 * ScaleUpFabricConfig captures the desired scale-up fabric configuration in logical
 * terms, so RMS can apply it regardless of which switch API it uses to configure
 * the fabric manager.
 */
message ScaleUpFabricConfig {
  // Topology to be configured for the scale-up fabric (applied to the fabric manager).
  string topology_type = 1;

  // Additional static configuration entries to apply to the fabric manager. This is a
  // generic pass-through for any configuration not modeled by a dedicated field
  // above; RMS applies each entry via the fabric manager's static-config API. Each
  // (config_file_name, key) must be unique; duplicate keys are rejected.
  repeated rack_manager.ScaleUpFabricStaticConfig extra_static_configs = 2;
}

/*
 * ConfigureScaleUpFabricManagerRequest declaratively describes the desired scale-up
 * fabric across a set of switches. RMS reconciles the switches toward this desired
 * state, applying only the changes that are required (for example, it does nothing
 * when the observed configuration already matches this request).
 *
 * Direct switch requests use each node's host_endpoint for address and credentials.
 */
message ConfigureScaleUpFabricManagerRequest {
  // All switches that form the scale-up fabric.
  rack_manager.NodeSet nodes = 1;

  // ID of the switch node that should run the fabric manager (the primary host).
  // If absent, RMS selects the switch at the lowest position in the rack.
  optional string primary_switch_node_id = 2;

  // Optional site selector used for switch server verification (TLS).
  // Defaults to --default-switch-domain when unset.
  optional string domain = 3;

  // Desired scale-up fabric configuration to reconcile the switches toward.
  ScaleUpFabricConfig config = 4;
}

// ConfigureScaleUpFabricManagerResponse returns the handle to the reconciliation job.
message ConfigureScaleUpFabricManagerResponse {
  // ID of the asynchronous job that reconciles the scale-up fabric.
  // Poll it via rack_manager.GetJobStatus. Once completed,
  // rack_manager.JobStatus.result_json contains a JSON-encoded
  // rack_manager.ScaleUpFabricStatus describing the resulting fabric state.
  string job_id = 1;
}

// StartSystemValidationRequest identifies the node to scan. NVSSVT reaches the
// DUT over its BMC (required) and, when supplied, its host OS, so node.bmc_endpoint
// must carry username/password credentials; NVSSVT's CLI takes no other
// credential form. RMS fixes the qualification level and leaves every other
// NVSSVT knob at its CLI default, so they are not exposed here.
message StartSystemValidationRequest {
  rack_manager.NodeInfo node = 1;
}

// StartSystemValidationResponse reports the launched scan's job handle. The
// NVSSVT process id and log directory live on the launcher's side of the pod
// and are not addressable by callers, so they are reported in RMS's logs
// rather than here; the scan's log directory also appears in the job's
// result_json once it completes.
message StartSystemValidationResponse {
  // ID of the asynchronous job tracking this scan. Poll it via
  // rack_manager.GetJobStatus.
  string job_id = 1;
  // RFC 3339 timestamp the scan was launched at.
  string started_at = 2;
}
